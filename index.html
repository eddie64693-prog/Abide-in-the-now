<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的靈魂碎片段落 | 個人心情空間</title>
    <style>
        /* CSS 樣式：定義網站的視覺氛圍 */
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            line-height: 1.8;
            color: #444;
            background-color: #f9f7f2; /* 溫暖的米色底 */
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ffffff;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 5px;
            color: #555;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #888;
            font-size: 0.9em;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 文章區塊樣式 */
        article {
            background: white;
            padding: 40px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        .date {
            font-size: 0.8em;
            color: #bbb;
            margin-bottom: 10px;
        }

        .mood-tag {
            display: inline-block;
            background: #eef2f3;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            color: #777;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #bbb;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <header>
        <h1>靈魂的拾荒者</h1>
        <p>在這裡，我只對自己誠實。</p>
        <nav>
            <a href="#">首頁</a>
            <a href="#">時光機</a>
            <a href="#">關於我</a>
        </nav>
    </header>

    <div class="container">
        <article>
            <div class="date">2026年2月26日 · 深夜</div>
            <div class="mood-tag">#微雨的街道</div>
            <h2>那些沒說出口的話</h2>
            <p>
                今天台北下了一場小雨，空氣中帶著一點點潮濕的泥土味。
                坐在咖啡廳的窗邊，看著路人匆忙的神情，突然覺得自己與這個世界有一種微妙的距離感...
            </p>
            <p>
                有時候，文字是唯一的出口。不必為了迎合誰而寫，只需紀錄下這一刻的呼吸。
            </p>
        </article>

        <article>
            <div class="date">2026年2月20日 · 黃昏</div>
            <div class="mood-tag">#重新出發</div>
            <h2>關於簡單生活的練習</h2>
            <p>
                斷捨離不只是丟掉物品，更是清理內心的雜質。
                今天把書架整理了一遍，心情意外地變得很輕盈。
            </p>
        </article>
    </div>

    <footer>
        &copy; 2026 我的心情紀錄空間. Made with Love.
    </footer>

</body>
</html>
